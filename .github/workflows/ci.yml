name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Run examples
        run: npm run examples

      # Packs the tarball npm would publish, installs it into a clean
      # project and imports it, so a broken "exports" map or a missing
      # build file fails here instead of after a release.
      - name: Check the published package
        run: npm run check:package

  # The supported range, not just the version maintainers use day to day:
  # the minimum Node with ML-DSA-65 in node:crypto (24.6.0), the newest
  # release line, and Windows/macOS for path and line-ending differences.
  compatibility:
    name: compatibility (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: "24.6.0" }
          - { os: ubuntu-latest, node: "26" }
          - { os: windows-latest, node: "24" }
          - { os: macos-latest, node: "24" }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Run examples
        run: npm run examples
